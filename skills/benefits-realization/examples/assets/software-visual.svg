<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Relay · observed handling time</title><desc id="desc">Fictional additional teaching dataset · 4 December 2026 review · comparable-ticket assumption Full source data and explanation accompany this graphic.</desc><rect width="1120" height="760" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="25" fill="#16314c" font-weight="700">Relay · observed handling time</text><text x="30" y="76" font-size="13" fill="#24364e" font-weight="400">Fictional additional teaching dataset · 4 December 2026 review · comparable-ticket assumption</text><text x="350" y="140" font-size="13" fill="#24364e" font-weight="400">0</text><text x="850" y="140" font-size="13" fill="#24364e" font-weight="400">15</text><text x="900" y="140" font-size="13" fill="#24364e" font-weight="400">minutes / ticket</text><text x="30" y="196" font-size="14" fill="#24364e" font-weight="400">Baseline · 40 tickets / 600 minutes</text><rect x="350" y="175" width="500.0" height="32" rx="7" fill="#bddbec" stroke="#b9c7da"/><text x="865.0" y="197" font-size="14" fill="#24364e" font-weight="700">15</text><text x="30" y="266" font-size="14" fill="#24364e" font-weight="400">Post-pilot · 50 tickets / 600 minutes</text><rect x="350" y="245" width="400.0" height="32" rx="7" fill="#bddbec" stroke="#b9c7da"/><text x="765.0" y="267" font-size="14" fill="#24364e" font-weight="700">12</text><text x="30" y="665" font-size="13" fill="#24364e" font-weight="400">Mean effort fell 3 minutes (20%). At 50 tickets, the difference is 150 minutes / 2.5 hours. This does not establish causation, net</text><text x="30" y="685" font-size="13" fill="#24364e" font-weight="400">benefit or cash savings.</text></g></svg>