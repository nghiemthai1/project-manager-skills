<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="680" viewBox="0 0 1580 680" role="img" aria-labelledby="title desc"><title id="title">Relay integration milestone logic</title><desc id="desc">Finish-to-start zero-lag milestone network in working-day offsets.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536581"/></marker></defs><rect width="100%" height="100%" fill="#f5f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">MILESTONE LOGIC</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">Seven offsets are not a committed date</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">The network explains the driving path and evidence event while keeping calendars, resources and authority visible.</text><text x="38" y="185" font-family="Arial,sans-serif" font-size="16" fill="#0c234b" font-weight="700">Modeled finish: 7 working-day offsets · 4 critical records · 30 October target requires a separate dated model</text><path d="M310 342 C360 342,360 342,410 342" fill="none" stroke="#536581" stroke-width="2" marker-end="url(#a)"/><path d="M310 342 C360 342,360 467,410 467" fill="none" stroke="#536581" stroke-width="2" marker-end="url(#a)"/><path d="M660 342 C710 342,710 342,760 342" fill="none" stroke="#536581" stroke-width="2" marker-end="url(#a)"/><path d="M660 467 C710 467,710 342,760 342" fill="none" stroke="#536581" stroke-width="2" marker-end="url(#a)"/><path d="M1010 342 C1060 342,1060 342,1110 342" fill="none" stroke="#536581" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="300" width="250" height="84" rx="14" fill="#fff" stroke="#d80b61" stroke-width="3"/><text x="76" y="324" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">A · activity</text><text x="76" y="347" font-family="Arial,sans-serif" font-size="14" fill="#0c234b" font-weight="800">Agree contract</text><text x="76" y="368" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">0–2 · float 0</text><rect x="410" y="300" width="250" height="84" rx="14" fill="#fff" stroke="#d80b61" stroke-width="3"/><text x="426" y="324" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">B · activity</text><text x="426" y="347" font-family="Arial,sans-serif" font-size="14" fill="#0c234b" font-weight="800">Implement interface</text><text x="426" y="368" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">2–6 · float 0</text><rect x="410" y="425" width="250" height="84" rx="14" fill="#fff" stroke="#08766c" stroke-width="1"/><text x="426" y="449" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">C · activity</text><text x="426" y="472" font-family="Arial,sans-serif" font-size="14" fill="#0c234b" font-weight="800">Prepare receiver tests</text><text x="426" y="493" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">2–5 · float 1</text><rect x="760" y="300" width="250" height="84" rx="14" fill="#fff" stroke="#d80b61" stroke-width="3"/><text x="776" y="324" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">D · activity</text><text x="776" y="347" font-family="Arial,sans-serif" font-size="14" fill="#0c234b" font-weight="800">Integrate</text><text x="776" y="368" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">6–7 · float 0</text><path d="M1152 300L1194 342L1152 384L1110 342Z" fill="#fff" stroke="#d80b61" stroke-width="4"/><text x="1152" y="347" font-family="Arial,sans-serif" font-size="11" fill="#d80b61" font-weight="800" text-anchor="middle">E</text><text x="1210" y="329" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">Accept integration</text><text x="1210" y="351" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">offset 7 · proposed</text><text x="38" y="608" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="400">Critical = zero total float in this complete simplified network; it is not a commitment or resource guarantee.</text><text x="38" y="632" font-family="Arial,sans-serif" font-size="11" fill="#667085" font-weight="400">No calendar, fixed constraints, lag, other relationship types or resource leveling.</text></svg>