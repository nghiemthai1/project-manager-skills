<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Relay · capacity is specific to the person</title><desc id="desc">Fictional capacity exercise · 19–30 October 2026 · support counted once · no staffing commitments inferred Full source data and explanation accompany this graphic.</desc><rect width="1120" height="760" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="25" fill="#16314c" font-weight="700">Relay · capacity is specific to the person</text><text x="30" y="76" font-size="13" fill="#24364e" font-weight="400">Fictional capacity exercise · 19–30 October 2026 · support counted once · no staffing commitments inferred</text><text x="340" y="151" font-size="14" fill="#24364e" font-weight="400">Common scale: hours in the stated period (starts at zero)</text><text x="30" y="230" font-size="22" fill="#24364e" font-weight="700">Omar</text><text x="30" y="257" font-size="14" fill="#24364e" font-weight="400">Available 56 h / demand 64 h</text><rect x="340" y="210" width="504" height="40" rx="7" fill="#edf1f7" stroke="#b9c7da"/><rect x="340" y="264" width="576" height="40" rx="7" fill="#bddbec" stroke="#b9c7da"/><path d="M844,202 V310" stroke="#923747" stroke-width="3" stroke-dasharray="5 3"/><text x="350" y="237" font-size="14" fill="#24364e" font-weight="400">Availability · 56 h</text><text x="350" y="291" font-size="14" fill="#24364e" font-weight="400">Demand · 64 h</text><text x="960" y="290" font-size="14" fill="#923747" font-weight="700">Overload 8 h</text><text x="30" y="400" font-size="22" fill="#24364e" font-weight="700">Lena</text><text x="30" y="427" font-size="14" fill="#24364e" font-weight="400">Available 32 h / demand 20 h</text><rect x="340" y="380" width="288" height="40" rx="7" fill="#edf1f7" stroke="#b9c7da"/><rect x="340" y="434" width="180" height="40" rx="7" fill="#bddbec" stroke="#b9c7da"/><path d="M628,372 V480" stroke="#923747" stroke-width="3" stroke-dasharray="5 3"/><text x="350" y="407" font-size="14" fill="#24364e" font-weight="400">Availability · 32 h</text><text x="350" y="461" font-size="14" fill="#24364e" font-weight="400">Demand · 20 h</text><text x="960" y="460" font-size="14" fill="#276b58" font-weight="700">Spare 12 h</text><text x="30" y="665" font-size="13" fill="#24364e" font-weight="400">Total: 84 h demanded / 88 h available. Four spare team hours do not resolve Omar’s eight-hour overload. Lena’s skills are not</text><text x="30" y="685" font-size="13" fill="#24364e" font-weight="400">interchangeable. Check daily concurrency before claiming feasibility.</text></g></svg>