rial, sans-serif" font-size="12" fill="#13294b" font-weight="600">incident demand.</text><text x="38" y="782" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">As of 2026-11-02 · resource-constrained baseline · Known person-level demand compared with modeled weekly availability; timing and skill constraints remain explicit checks.</text></svg>