<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="724" viewBox="0 0 1440 724" role="img" aria-labelledby="title desc"><title id="title">Relay capacity decision</title><desc id="desc">Capacity plan for 19–30 October 2026. Known demand is compared with each person’s modeled availability; unknown allocations remain visible.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b1f40" flood-opacity=".10"/></filter></defs><rect width="100%" height="100%" fill="#f5f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial, sans-serif" font-size="12" fill="#d80b61" font-weight="800">CAPACITY DECISION</text><text x="38" y="96" font-family="Arial, sans-serif" font-size="40" fill="#0c234b" font-weight="800">Four spare hours still leave an eight-hour shortage</text><text x="38" y="130" font-family="Arial, sans-serif" font-size="15" fill="#536581" font-weight="400">Compare capacity person by person. Team totals cannot transfer a skill or erase a timed bottleneck.</text><g filter="url(#shadow)"><rect x="38" y="166" width="252" height="92" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="54" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">PEOPLE</text><text x="54" y="223" font-family="Arial, sans-serif" font-size="24" fill="#0c234b" font-weight="800">2</text><text x="54" y="244" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">in supplied scope</text></g><g filter="url(#shadow)"><rect x="308" y="166" width="252" height="92" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="324" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">AVAILABLE</text><text x="324" y="223" font-family="Arial, sans-serif" font-size="24" fill="#0c234b" font-weight="800">88 h</text><text x="324" y="244" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">after leave + overhead</text></g><g filter="url(#shadow)"><rect x="578" y="166" width="252" height="92" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="594" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">KNOWN DEMAND</text><text x="594" y="223" font-family="Arial, sans-serif" font-size="24" fill="#0c234b" font-weight="800">84 h</text><text x="594" y="244" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">unknowns excluded</text></g><g filter="url(#shadow)"><rect x="848" y="166" width="252" height="92" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="864" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">PERSON OVERLOAD</text><text x="864" y="223" font-family="Arial, sans-serif" font-size="24" fill="#0c234b" font-weight="800">8 h</text><text x="864" y="244" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">not netted across people</text></g><g filter="url(#shadow)"><rect x="1118" y="166" width="252" height="92" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1134" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">UNKNOWN WORK</text><text x="1134" y="223" font-family="Arial, sans-serif" font-size="24" fill="#0c234b" font-weight="800">0</text><text x="1134" y="244" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">allocation records</text></g><g data-person="OMAR"><rect x="26" y="314" width="1388" height="108" rx="14" fill="#fff" stroke="#d4deeb"/><rect x="26" y="314" width="6" height="108" rx="3" fill="#d80b61"/><text x="50" y="343" font-family="Arial, sans-serif" font-size="17" fill="#0c234b" font-weight="800">Omar</text><text x="50" y="364" font-family="Arial, sans-serif" font-size="11" fill="#536581" font-weight="400">Integration engineer</text><text x="50" y="386" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">integration engineering · production suppo</text><rect x="360" y="339" width="720.0" height="34" rx="5" fill="#d80b61"/><text x="368" y="361" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="700">Relay delivery · 48 h</text><rect x="1080.0" y="339" width="240.0" height="34" rx="5" fill="#176b87"/><text x="1088.0" y="361" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="700">Support rotation · 16 h</text><line x1="1200.0" y1="328" x2="1200.0" y2="384" stroke="#0c234b" stroke-width="3" stroke-dasharray="5 3"/><text x="1200.0" y="402" font-family="Arial, sans-serif" font-size="10" fill="#0c234b" font-weight="700" text-anchor="middle">available 56 h</text><text x="1398" y="356" font-family="Arial, sans-serif" font-size="12" fill="#0c234b" font-weight="700" text-anchor="end">64 h demand</text><text x="1398" y="380" font-family="Arial, sans-serif" font-size="11" fill="#d80b61" font-weight="800" text-anchor="end">OVER 8 h</text></g><g data-person="LENA"><rect x="26" y="436" width="1388" height="108" rx="14" fill="#fff" stroke="#d4deeb"/><rect x="26" y="436" width="6" height="108" rx="3" fill="#08766c"/><text x="50" y="465" font-family="Arial, sans-serif" font-size="17" fill="#0c234b" font-weight="800">Lena</text><text x="50" y="486" font-family="Arial, sans-serif" font-size="11" fill="#536581" font-weight="400">Security engineer</text><text x="50" y="508" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">security assurance</text><rect x="360" y="461" width="300.0" height="34" rx="5" fill="#d80b61"/><text x="368" y="483" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="700">Relay security revi · 20 h</text><line x1="840.0" y1="450" x2="840.0" y2="506" stroke="#0c234b" stroke-width="3" stroke-dasharray="5 3"/><text x="840.0" y="524" font-family="Arial, sans-serif" font-size="10" fill="#0c234b" font-weight="700" text-anchor="middle">available 32 h</text><text x="1398" y="478" font-family="Arial, sans-serif" font-size="12" fill="#0c234b" font-weight="700" text-anchor="end">20 h demand</text><text x="1398" y="502" font-family="Arial, sans-serif" font-size="11" fill="#08766c" font-weight="800" text-anchor="end">SPARE 12 h</text></g><text x="38" y="578" font-family="Arial, sans-serif" font-size="10" fill="#d80b61" font-weight="800">DECISION</text><text x="38" y="602" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="600">Confirm a qualified coverage, scope or sequence decision for Omar&#x27;s eight-hour shortage, then recalculate the affected people and schedule.</text><text x="38" y="660" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">As of 2026-10-16 · proposed planning case · Known person-level allocation demand compared with gross hours less leave and overhead; overloads are never netted across people.</text></svg>