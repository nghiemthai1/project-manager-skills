<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Relay - RAID control register</title><desc id="desc">RAID exception register as of 2026-10-16. Type and evidence remain explicit.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">DELIVERY CONTROLS</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">Four records, four decisions</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">Current blockers, uncertain events, planning premises and usable handoffs stay separate while their links remain visible.</text><rect x="38" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">ATTENTION</text><text x="53" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">4</text><rect x="308" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">UNKNOWN</text><text x="323" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="578" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">OVERDUE</text><text x="593" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="848" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">EVIDENCED</text><text x="863" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">0</text><rect x="1118" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">ITEMS</text><text x="1133" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">4</text><rect x="38" y="280" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="280" width="8" height="58" rx="4" fill="#d80b61"/><text x="60" y="302" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">R-001 - Interface incompatibility</text><text x="600" y="302" font-family="Arial,sans-serif" font-size="11" fill="#d80b61" font-weight="800">RISK - open</text><text x="930" y="302" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention, unknown</text><text x="60" y="324" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Interface incompatibility could prevent SSO integration and acceptance. | Confirm ownership and execute a versioned compatibility check when the environment and interface</text><rect x="38" y="352" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="352" width="8" height="58" rx="4" fill="#b42318"/><text x="60" y="374" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">I-001 - Test environment unavailable</text><text x="600" y="374" font-family="Arial,sans-serif" font-size="11" fill="#b42318" font-weight="800">ISSUE - open</text><text x="930" y="374" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention</text><text x="60" y="396" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The test environment is unavailable now and prevents planned verification. | Restore usable access and verify the environment before relying on it.</text><rect x="38" y="424" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="424" width="8" height="58" rx="4" fill="#08766c"/><text x="60" y="446" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">DEP-001 - Audit interface handoff</text><text x="600" y="446" font-family="Arial,sans-serif" font-size="11" fill="#08766c" font-weight="800">DEPENDENCY - at risk</text><text x="930" y="446" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention, overdue</text><text x="60" y="468" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The audit interface is forecast for 22 October against a 20 October receiver need. | Establish provider, receiver, usable condition and binding commitment, then assess co</text><rect x="38" y="496" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="496" width="8" height="58" rx="4" fill="#a25b00"/><text x="60" y="518" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">A-001 - Test environment represents pilot behavior</text><text x="600" y="518" font-family="Arial,sans-serif" font-size="11" fill="#a25b00" font-weight="800">ASSUMPTION - open</text><text x="930" y="518" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention</text><text x="60" y="540" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The plan relies on the test environment representing pilot identity-provider behavior. | Assign a validator and compare relevant configuration and behavior before relying</text><text x="38" y="706" font-family="Arial,sans-serif" font-size="12" fill="#b42318" font-weight="800">Attention IDs: R-001, I-001, DEP-001, A-001</text><text x="38" y="729" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">Observed conditions are issues; possible events are risks; planning premises and provider inputs remain their own record types.</text></svg>