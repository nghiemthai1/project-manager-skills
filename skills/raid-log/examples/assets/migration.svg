<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Northstar - RAID transition register</title><desc id="desc">RAID exception register as of 2026-11-06. Type and evidence remain explicit.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">MIGRATION CONTROLS</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">Materialization creates a link, not a rename</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">The prior risk, observed issue and required mapping retain separate evidence, owners and closure rules.</text><rect x="38" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">ATTENTION</text><text x="53" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">3</text><rect x="308" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">UNKNOWN</text><text x="323" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="578" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">OVERDUE</text><text x="593" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="848" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">EVIDENCED</text><text x="863" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">0</text><rect x="1118" y="160" width="252" height="82" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">ITEMS</text><text x="1133" y="218" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">3</text><rect x="38" y="280" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="280" width="8" height="58" rx="4" fill="#d80b61"/><text x="60" y="302" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">M-R01 - Attachment identifiers may break relations</text><text x="600" y="302" font-family="Arial,sans-serif" font-size="11" fill="#d80b61" font-weight="800">RISK - materialized</text><text x="930" y="302" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention, unknown</text><text x="60" y="324" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Inconsistent attachment identifiers may break ticket relationships. | Link the observed population to M-I002 and specify any remaining uncertain populations or conditions</text><rect x="38" y="352" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="352" width="8" height="58" rx="4" fill="#b42318"/><text x="60" y="374" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">M-I002 - Lost attachment links observed</text><text x="600" y="374" font-family="Arial,sans-serif" font-size="11" fill="#b42318" font-weight="800">ISSUE - investigating</text><text x="930" y="374" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention</text><text x="60" y="396" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Lost attachment links were observed in the 6 November rehearsal. | Capture expected and observed links, affected population, mapping version and reproduction conditions, </text><rect x="38" y="424" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="424" width="8" height="58" rx="4" fill="#08766c"/><text x="60" y="446" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">M-DEP01 - Attachment mapping handoff</text><text x="600" y="446" font-family="Arial,sans-serif" font-size="11" fill="#08766c" font-weight="800">DEPENDENCY - at risk</text><text x="930" y="446" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">attention, overdue</text><text x="60" y="468" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The mapping was needed 2 November and forecast 4 November; actual accepted delivery is not supplied. | Recover the actual provider and receiver state and confirm the usab</text><text x="38" y="706" font-family="Arial,sans-serif" font-size="12" fill="#b42318" font-weight="800">Attention IDs: M-R01, M-I002, M-DEP01</text><text x="38" y="729" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">M-I002 contains observed failure evidence; M-R01 preserves the earlier uncertain event and any remaining bounded uncertainty.</text></svg>