mily="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">110 k USD</text><text x="38" y="509" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Bottom-up EAC</text><rect x="390" y="486" width="739.1304347826086" height="34" rx="7" fill="#c26716"/><text x="1141.1304347826085" y="509" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">120 k USD</text><text x="38" y="571" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Remaining-at-budget EAC</text><rect x="390" y="548" width="665.2173913043479" height="34" rx="7" fill="#6f42a6"/><text x="1067.217391304348" y="571" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">108 k USD</text><text x="38" y="633" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Cost-efficiency EAC</text><rect x="390" y="610" width="739.1304347826086" height="34" rx="7" fill="#d80b61"/><text x="1141.1304347826085" y="633" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">120 k USD</text><text x="38" y="695" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Combined-efficiency EAC</text><rect x="390" y="672" width="850.0" height="34" rx="7" fill="#b42318"/><text x="1252.0" y="695" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">138 k USD</text><text x="38" y="758" font-family="Arial, sans-serif" font-size="10" fill="#d80b61" font-weight="800">DECISION</text><text x="38" y="782" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="600">Reconcile the current ETC and obligations, then obtain an explicit reserve release plus additional funding or a supported scope decision.</text><text x="38" y="840" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">As of 2026-10-16 · conditional forecast · amounts in k USD</text></svg>