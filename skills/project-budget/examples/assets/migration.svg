<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="854" viewBox="0 0 1440 854" role="img" aria-labelledby="title desc"><title id="title">Northstar cost pressure</title><desc id="desc">Project budget comparison as of 2026-10-23. Bars compare overlapping financial views and are not additive.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial, sans-serif" font-size="12" fill="#d80b61" font-weight="800">FUNDING PRESSURE</text><text x="38" y="96" font-family="Arial, sans-serif" font-size="40" fill="#0c234b" font-weight="800">Low spend does not mean healthy delivery</text><text x="38" y="130" font-family="Arial, sans-serif" font-size="15" fill="#536581" font-weight="400">Only 31.25% of BAC is spent, yet cost efficiency implies 300k and vendor obligations remain incomplete.</text><rect x="38" y="166" width="252" height="90" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">BAC</text><text x="53" y="222" font-family="Arial, sans-serif" font-size="23" fill="#0c234b" font-weight="800">240</text><text x="53" y="242" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">B1</text><rect x="308" y="166" width="252" height="90" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">ACTUAL</text><text x="323" y="222" font-family="Arial, sans-serif" font-size="23" fill="#0c234b" font-weight="800">75</text><text x="323" y="242" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">at cutoff</text><rect x="578" y="166" width="252" height="90" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">CPI</text><text x="593" y="222" font-family="Arial, sans-serif" font-size="23" fill="#0c234b" font-weight="800">0.800</text><text x="593" y="242" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">cost efficiency</text><rect x="848" y="166" width="252" height="90" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">SPI</text><text x="863" y="222" font-family="Arial, sans-serif" font-size="23" fill="#0c234b" font-weight="800">0.750</text><text x="863" y="242" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">value progress</text><rect x="1118" y="166" width="252" height="90" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="190" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="800">LEDGER DIFFERENCE</text><text x="1133" y="222" font-family="Arial, sans-serif" font-size="23" fill="#0c234b" font-weight="800">0</text><text x="1133" y="242" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">AC less category actual</text><text x="38" y="323" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Actual cost</text><rect x="390" y="300" width="170.00000000000003" height="34" rx="7" fill="#176b87"/><text x="572.0" y="323" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">75 k USD</text><text x="38" y="385" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Performance baseline</text><rect x="390" y="362" width="544.0000000000001" height="34" rx="7" fill="#0c234b"/><text x="946.0000000000001" y="385" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">240 k USD</text><text x="38" y="447" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Funding envelope</text><rect x="390" y="424" width="598.4000000000001" height="34" rx="7" fill="#08766c"/><text x="1000.4000000000001" y="447" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">264 k USD</text><text x="38" y="509" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Bottom-up EAC</text><text x="390" y="509" font-family="Arial, sans-serif" font-size="12" fill="#a25b00" font-weight="700">Unavailable: remaining estimate has unknown fields</text><text x="38" y="571" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Remaining-at-budget EAC</text><rect x="390" y="548" width="578.0" height="34" rx="7" fill="#6f42a6"/><text x="980.0" y="571" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">255 k USD</text><text x="38" y="633" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Cost-efficiency EAC</text><rect x="390" y="610" width="680.0000000000001" height="34" rx="7" fill="#d80b61"/><text x="1082.0" y="633" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">300 k USD</text><text x="38" y="695" font-family="Arial, sans-serif" font-size="13" fill="#13294b" font-weight="700">Combined-efficiency EAC</text><rect x="390" y="672" width="850.0" height="34" rx="7" fill="#b42318"/><text x="1252.0" y="695" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="700">375 k USD</text><text x="38" y="758" font-family="Arial, sans-serif" font-size="10" fill="#d80b61" font-weight="800">DECISION</text><text x="38" y="782" font-family="Arial, sans-serif" font-size="12" fill="#13294b" font-weight="600">Complete the vendor and remaining-work reconciliation, then present reserve, additional-funding and phased-scope choices to Noel.</text><text x="38" y="840" font-family="Arial, sans-serif" font-size="10" fill="#667085" font-weight="400">As of 2026-10-23 · conditional forecast with incomplete obligations · amounts in k USD</text></svg>