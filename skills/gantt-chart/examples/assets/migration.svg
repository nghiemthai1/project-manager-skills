<text x="24.0" y="746.0" font-size="10" fill="#007969" font-weight="700">READING NOTES / SOURCE BOUNDARIES</text>
<text x="24.0" y="769.0" font-size="10" fill="#576a74" font-weight="400">Supplied CPM result for the fictional parallel network; zero-lag FS relationships, Monday–Friday, no holidays, no resource leveling. The 16 November serialized case is a</text>
<text x="24.0" y="787.0" font-size="10" fill="#576a74" font-weight="400">separate conditional scenario and is not plotted as forecast.</text>
<text x="24.0" y="805.0" font-size="10" fill="#576a74" font-weight="400">Task E is the displayed checkpoint, not acceptance evidence. IDs A–E identify this teaching network only.</text>
<text x="24.0" y="823.0" font-size="10" fill="#576a74" font-weight="400">Weekend shading adds no productive effort. The forecast is supplied, not recalculated by the renderer.</text>
<text x="24.0" y="841.0" font-size="10" fill="#576a74" font-weight="400">Parallel B/C needs separate available resources. Full-time Chen on both implies a conditional serialized 16 November boundary, not the plotted 11 November case.</text>
