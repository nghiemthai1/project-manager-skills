<text x="24.0" y="771.0" font-size="11" fill="#24364e" font-weight="400">Task E is the displayed checkpoint, not acceptance evidence. IDs A–E identify this teaching network only.</text>
<text x="24.0" y="789.0" font-size="11" fill="#24364e" font-weight="400">Weekend shading adds no productive effort. The forecast is supplied, not recalculated by the renderer.</text>
<text x="24.0" y="807.0" font-size="11" fill="#24364e" font-weight="400">Parallel B/C needs separate available resources. Full-time Chen on both implies a conditional serialized 16 November boundary, not the plotted 11 November case.</text>
