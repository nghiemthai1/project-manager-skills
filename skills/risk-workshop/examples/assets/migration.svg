<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Northstar - migration risk workshop</title><desc id="desc">Risk exposure and control evidence as of 2026-10-23. Unknown ratings remain unplotted.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">MIGRATION RISK CONTROL</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">Separate relationship integrity from recovery</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">Two distinct failure mechanisms need distinct evidence, owners, triggers and decisions.</text><rect x="38" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PRIORITY</text><text x="53" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">1</text><rect x="308" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">UNKNOWN RATINGS</text><text x="323" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">2</text><rect x="578" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">ASSESSED</text><text x="593" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">0</text><rect x="848" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">EVIDENCED CONTROLS</text><text x="863" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">0</text><rect x="1118" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">SCALE</text><text x="1133" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">Not agreed</text><rect x="38" y="285" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="285" width="8" height="58" rx="4" fill="#a25b00"/><text x="60" y="307" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">M-R01 - Attachment relationships may be incorr</text><text x="555" y="307" font-family="Arial,sans-serif" font-size="11" fill="#a25b00" font-weight="800">hypothesis</text><text x="780" y="307" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">rating unknown</text><text x="1020" y="307" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">investigate - proposed</text><text x="60" y="329" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Inconsistent identifiers may break attachment-to-ticket mapping -&gt; Migrated attachments link to the wrong ticket or lose their relationship -&gt; Accepted rec</text><rect x="38" y="357" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="357" width="8" height="58" rx="4" fill="#a25b00"/><text x="60" y="379" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">M-R02 - Restore may not produce a usable servi</text><text x="555" y="379" font-family="Arial,sans-serif" font-size="11" fill="#a25b00" font-weight="800">hypothesis</text><text x="780" y="379" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">rating unknown</text><text x="1020" y="379" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">investigate - proposed</text><text x="60" y="401" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The actual restore scenario and environment have not been demonstrated -&gt; Cutover failure cannot be recovered within the usable-service boundary -&gt; Support</text><text x="38" y="685" font-family="Arial,sans-serif" font-size="12" fill="#b42318" font-weight="800">Priority IDs: M-R02</text><text x="38" y="708" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">No agreed matrix or assessed values were supplied; both risks stay in the unknown lane and later incidents do not create backdated probabilities.</text><text x="38" y="728" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">The workshop proposes Chen, Beck and Rosa roles but does not confirm capacity, transfer business exposure or issue Noel&#x27;s cutover decision.</text></svg>