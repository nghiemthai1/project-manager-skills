<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Relay - recovery risk workshop</title><desc id="desc">Risk exposure and control evidence as of 2026-10-28. Unknown ratings remain unplotted.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">RISK CONTROL</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">A runbook is not a demonstrated control</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">Unknown probability stays visible while recovery and operator evidence drive the response.</text><rect x="38" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PRIORITY</text><text x="53" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">1</text><rect x="308" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">UNKNOWN RATINGS</text><text x="323" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">2</text><rect x="578" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">ASSESSED</text><text x="593" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">0</text><rect x="848" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">EVIDENCED CONTROLS</text><text x="863" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">0</text><rect x="1118" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">SCALE</text><text x="1133" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">Not agreed</text><rect x="38" y="285" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="285" width="8" height="58" rx="4" fill="#a25b00"/><text x="60" y="307" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">R-REC - Recovery path may fail under relevant </text><text x="555" y="307" font-family="Arial,sans-serif" font-size="11" fill="#a25b00" font-weight="800">hypothesis</text><text x="780" y="307" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">rating unknown</text><text x="1020" y="307" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">investigate - proposed</text><text x="60" y="329" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The actual identity-provider failure scenario and recovery access have not been demonstrated -&gt; The recovery path does not work when the pilot needs secure</text><rect x="38" y="357" width="1360" height="58" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="357" width="8" height="58" rx="4" fill="#a25b00"/><text x="60" y="379" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">R-OPS - Operators may not use recovery guidanc</text><text x="555" y="379" font-family="Arial,sans-serif" font-size="11" fill="#a25b00" font-weight="800">hypothesis</text><text x="780" y="379" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">rating unknown</text><text x="1020" y="379" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">mitigate - proposed</text><text x="60" y="401" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Operator access and walkthrough evidence are absent -&gt; Support cannot complete the required recovery steps -&gt; Disruption extends and service restoration re</text><text x="38" y="685" font-family="Arial,sans-serif" font-size="12" fill="#b42318" font-weight="800">Priority IDs: R-REC</text><text x="38" y="708" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">No agreed probability-impact scale or assessed values were supplied, so both risks remain in the unknown lane and no score is fabricated.</text><text x="38" y="728" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">The workshop proposes work and preserves Lena&#x27;s and Theo&#x27;s roles; it does not assign the technical performer, approve effort or accept residual exposure.</text></svg>