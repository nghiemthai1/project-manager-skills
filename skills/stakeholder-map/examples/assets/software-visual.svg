ext><text x="45" y="439" font-size="14" fill="#24364e" font-weight="400">No supplied placement</text><rect x="560" y="380" width="510" height="195" rx="7" fill="#e7eff8" stroke="#b9c7da"/><text x="575" y="410" font-size="17" fill="#24364e" font-weight="700">Low power / lower interest</text><text x="575" y="439" font-size="14" fill="#24364e" font-weight="400">No supplied placement</text><text x="30" y="613" font-size="15" fill="#815310" font-weight="700">Outside grid: pilot administrators · interest unknown; power provisionally low, needs validation</text><text x="30" y="665" font-size="13" fill="#24364e" font-weight="400">Use the companion impact × power table in the example: administrators may have high workflow impact despite low formal power. Lena’s</text><text x="30" y="685" font-size="13" fill="#24364e" font-weight="400">security authority does not imply budget authority. Validate engagement and representation.</text></g></svg>