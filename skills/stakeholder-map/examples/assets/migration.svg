<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Northstar - paired stakeholder map</title><desc id="desc">Paired qualitative stakeholder maps as of 2026-11-06. Unknown placements remain outside the grids.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">MIGRATION STAKEHOLDERS</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">Frontline impact is different from approval power</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">Compare engagement strategy with operational consequence so agents enter the evidence loop without displacing actual acceptors.</text><rect x="38" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">Q1 ELEVATE</text><text x="53" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="308" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">MANAGE CLOSELY</text><text x="323" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">5</text><rect x="578" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">UNKNOWN</text><text x="593" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="848" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">REPRESENTATION OPEN</text><text x="863" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><rect x="1118" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">OWNER GAPS</text><text x="1133" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">6</text><text x="38" y="278" font-family="Arial,sans-serif" font-size="18" fill="#0c234b" font-weight="800">Power x Interest</text><rect x="38" y="300" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="50" y="324" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Low power / high interest</text><rect x="368" y="300" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="380" y="324" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">High power / high interest</text><text x="382" y="350" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-NOEL - Noel</text><text x="382" y="370" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-SAIRA - Saira</text><text x="382" y="390" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-ROSA - Rosa</text><text x="382" y="410" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-CHEN - Chen</text><text x="382" y="430" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-BECK - Beck</text><rect x="38" y="470" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="50" y="494" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Low power / low interest</text><rect x="368" y="470" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="380" y="494" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">High power / low interest</text><text x="752" y="278" font-family="Arial,sans-serif" font-size="18" fill="#0c234b" font-weight="800">Impact x Power</text><rect x="752" y="300" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="764" y="324" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Q1 high impact / low power</text><text x="766" y="350" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-AGENTS - Support agents</text><rect x="1082" y="300" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="1094" y="324" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Q2 high impact / high power</text><text x="1096" y="350" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-NOEL - Noel</text><text x="1096" y="370" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-SAIRA - Saira</text><text x="1096" y="390" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-ROSA - Rosa</text><text x="1096" y="410" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-CHEN - Chen</text><rect x="752" y="470" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="764" y="494" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Q3 low impact / low power</text><rect x="1082" y="470" width="315" height="155" rx="12" fill="#fff" stroke="#ccd6e5"/><text x="1094" y="494" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Q4 low impact / high power</text><text x="1096" y="520" font-family="Arial,sans-serif" font-size="10" fill="#13294b" font-weight="700">ST-BECK - Beck</text><text x="38" y="665" font-family="Arial,sans-serif" font-size="11" fill="#a25b00" font-weight="800">UNKNOWN / UNPLACED</text><text x="200" y="665" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="700">ST-AGENTS - Support agents | power low, interest unknown, impact high</text><text x="38" y="845" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Placements are qualitative hypotheses; no within-quadrant ranking or measured coordinates are implied.</text><text x="38" y="868" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">Sponsor, business, operations, technical and supplier power are domain-specific and not interchangeable.</text></svg>