<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1194" viewBox="0 0 1440 1194" role="img" aria-labelledby="title desc"><title id="title">Relay - scope and WBS control</title><desc id="desc">Deliverable hierarchy and scope-control summary as of 2026-10-16. Connectors mean part-of, not sequence or effort.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">SCOPE CONTROL</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">Decompose the outcome, preserve the boundary</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">Inspect part-of structure, package dictionaries, requirement coverage, exclusions and later changes without turning the WBS into a schedule.</text><rect x="38" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">COVERAGE GAPS</text><text x="53" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">0</text><rect x="308" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PRIMARY OVERLAPS</text><text x="323" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">0</text><rect x="578" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PARTIAL</text><text x="593" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">4</text><rect x="848" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">OWNER GAPS</text><text x="863" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">7</text><rect x="1118" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="1133" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PROPOSED CHANGES</text><text x="1133" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">1</text><path d="M 330 594.0 C 370 594.0, 370 364, 410 364" fill="none" stroke="#7890ad" stroke-width="2"/><path d="M 330 594.0 C 370 594.0, 370 456, 410 456" fill="none" stroke="#7890ad" stroke-width="2"/><path d="M 330 594.0 C 370 594.0, 370 548, 410 548" fill="none" stroke="#7890ad" stroke-width="2"/><path d="M 330 594.0 C 370 594.0, 370 640, 410 640" fill="none" stroke="#7890ad" stroke-width="2"/><path d="M 330 594.0 C 370 594.0, 370 732, 410 732" fill="none" stroke="#7890ad" stroke-width="2"/><path d="M 330 594.0 C 370 594.0, 370 824, 410 824" fill="none" stroke="#7890ad" stroke-width="2"/><rect x="60" y="565.0" width="270" height="58" rx="10" fill="#fff" stroke="#0c234b" stroke-width="2"/><text x="72" y="585.0" font-family="Arial,sans-serif" font-size="10" fill="#0c234b" font-weight="800">1.0 - outcome</text><text x="72" y="607.0" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Accepted pilot service access</text><text x="72" y="619.0" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="410" y="335" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="422" y="355" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">1.1 - work package</text><text x="422" y="377" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">SAML access capability</text><text x="422" y="389" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="410" y="427" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="422" y="447" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">1.2 - work package</text><text x="422" y="469" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Audit-event integration</text><text x="422" y="481" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="410" y="519" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="422" y="539" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">1.3 - work package</text><text x="422" y="561" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Recovery access and evidence</text><text x="422" y="573" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="410" y="611" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="422" y="631" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">1.4 - work package</text><text x="422" y="653" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Service transition package</text><text x="422" y="665" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="410" y="703" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="422" y="723" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">1.5 - work package</text><text x="422" y="745" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Optional operator dashboard polish</text><text x="422" y="757" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">proposed deferral</text><rect x="410" y="795" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="422" y="815" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">1.6 - work package</text><text x="422" y="837" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Project control and closure eviden</text><text x="422" y="849" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><text x="38" y="1129" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Connectors mean part-of, not sequence, effort, authority or dependency.</text><text x="38" y="1153" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">Coverage is tested against D-001/B1 and the local trace keys in this snapshot; it is not a claim that uncertainty disappeared.</text></svg>