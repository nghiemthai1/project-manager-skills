<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1562" viewBox="0 0 1440 1562" role="img" aria-labelledby="title desc"><title id="title">Northstar - migration scope and WBS</title><desc id="desc">Deliverable hierarchy and scope-control summary as of 2026-11-06. Connectors mean part-of, not sequence or effort.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">MIGRATION SCOPE</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">The copy is not the whole migration</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">Inspect population, relationships, access, recovery, transition and control as separate results with visible acceptance boundaries.</text><rect x="38" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">COVERAGE GAPS</text><text x="53" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">0</text><rect x="308" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PRIMARY OVERLAPS</text><text x="323" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">0</text><rect x="578" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="178" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">PARTIAL</text><text x="593" y="211" font-family="Arial,sans-serif" font-size="22" fill="#0c234b" font-weight="800">6</text><rect x="848" y="155" width="252" height="78" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="178" font-family="Arial,sans-serif" fo