econcil</text><text x="422" y="481" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="60" y="611" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="72" y="631" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">M2 - work package</text><text x="72" y="653" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Access and archive route</text><text x="72" y="665" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="60" y="795" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="72" y="815" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">M3 - work package</text><text x="72" y="837" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Recovery capability</text><text x="72" y="849" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="60" y="979" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="72" y="999" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">M4 - work package</text><text x="72" y="1021" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Training and operational transitio</text><text x="72" y="1033" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><rect x="60" y="1163" width="270" height="58" rx="10" fill="#fff" stroke="#d80b61" stroke-width="2"/><text x="72" y="1183" font-family="Arial,sans-serif" font-size="10" fill="#d80b61" font-weight="800">M5 - work package</text><text x="72" y="1205" font-family="Arial,sans-serif" font-size="12" fill="#0c234b" font-weight="800">Project control and closure</text><text x="72" y="1217" font-family="Arial,sans-serif" font-size="9" fill="#667085" font-weight="400">in scope</text><text x="38" y="1497" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="800">Connectors mean part-of, not sequence, effort, authority or dependency.</text><text x="38" y="1521" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">Coverage is tested against M-D001/B1 and the local trace keys in this snapshot; open detail remains visible rather than called out of scope.</text></svg>