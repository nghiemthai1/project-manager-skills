<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Relay · a late interface is a local dependency gap</title><desc id="desc">Fictional snapshot · 16 October 2026 · provider forecast is not a commitment Full source data and explanation accompany this graphic.</desc><rect width="1120" height="760" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="25" fill="#16314c" font-weight="700">Relay · a late interface is a local dependency gap</text><text x="30" y="76" font-size="13" fill="#24364e" font-weight="400">Fictional snapshot · 16 October 2026 · provider forecast is not a commitment</text><rect x="30" y="170" width="330" height="200" rx="7" fill="#fff" stroke="#b9c7da"/><text x="45" y="205" font-size="17" fill="#24364e" font-weight="700">Platform provider</text><text x="45" y="244" font-size="13" fill="#24364e" font-weight="400">Named accountable contact: unknown</text><text x="45" y="286" font-size="13" fill="#24364e" font-weight="400">Forecast delivery: 22 October</text><text x="45" y="328" font-size="13" fill="#24364e" font-weight="400">Binding commitment: not supplied</text><rect x="395" y="170" width="330" height="200" rx="7" fill="#fff" stroke="#b9c7da"/><text x="410" y="205" font-size="17" fill="#24364e" font-weight="700">DEP-AUDIT · proposed ID</text><text x="410" y="244" font-size="13" fill="#24364e" font-weight="400">Audit-event interface</text><text x="410" y="286" font-size="13" fill="#24364e" font-weight="400">Schema/version + usable test endpoint</text><text x="410" y="328" font-size="13" fill="#24364e" font-weight="400">Validation boundary to confirm</text><rect x="760" y="170" width="330" height="200" rx="7" fill="#fff" stroke="#b9c7da"/><text x="775" y="205" font-size="17" fill="#24364e" font-weight="700">Integration receiver</text><text x="775" y="244" font-size="13" fill="#24364e" font-weight="400">Omar: technical remediation role</text><text x="775" y="286" font-size="13" fill="#24364e" font-weight="400">Needed-by: 20 October</text><text x="775" y="328" font-size="13" fill="#24364e" font-weight="400">Acceptance assignment: confirm</text><path d="M360,265 H395 M760,265 H725" stroke="#325c83" stroke-width="3"/><path d="M384,260 L395,265 L384,270 M749,260 L760,265 L749,270" fill="none" stroke="#325c83" stroke-width="3"/><rect x="170" y="420" width="780" height="145" rx="7" fill="#fff0d5" stroke="#b9c7da"/><text x="195" y="459" font-size="23" fill="#744a13" font-weight="700">Local margin: 20 − 22 = −2 calendar days</text><text x="195" y="495" font-size="16" fill="#24364e" font-weight="400">Actual delivery and acceptance are not evidenced. Project finish impact still needs the</text><text x="195" y="515" font-size="16" fill="#24364e" font-weight="400">remaining network, validation lead time and resource capacity.</text><text x="30" y="665" font-size="13" fill="#24364e" font-weight="400">R-001 possible incompatibility and I-001 unavailable environment remain separate records. Arrival of a file does not establish usable</text><text x="30" y="685" font-size="13" fill="#24364e" font-weight="400">receiver acceptance. No two-day pilot deferral is inferred.</text></g></svg>