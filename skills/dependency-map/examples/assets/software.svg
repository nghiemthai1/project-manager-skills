4" font-family="Arial" font-size="11" fill="#536581">closed</text><text x="38" y="919" font-family="Arial" font-size="11" fill="#667085">As of 2026-10-16 · Calendar days; no timezone conversion · Source: Fictional Relay scenario and dependency-map worked example, cut off 16 October 2026</text><text x="38" y="942" font-family="Arial" font-size="11" fill="#667085">Rule-based coordination view using supplied status and comparable needed-by/forecast dates. Local calendar margin is not CPM float or proven project delay.</text></svg>