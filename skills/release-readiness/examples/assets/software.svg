y="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The required boundary is known; detailed current results for rc3 are not supplied in this packet</text><rect x="38" y="417" width="1360" height="52" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="417" width="8" height="52" rx="4" fill="#08766c"/><text x="60" y="438" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">RR-03 - Scope and cost authorization</text><text x="530" y="438" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">follow up - governance</text><text x="830" y="438" font-family="Arial,sans-serif" font-size="12" fill="#08766c" font-weight="800">PASSED</text><text x="1080" y="438" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">accepted</text><text x="60" y="458" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Optional polish deferred and B2 funding set to 120k</text><rect x="38" y="483" width="1360" height="52" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="483" width="8" height="52" rx="4" fill="#08766c"/><text x="60" y="504" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">RR-04 - Pilot baseline window</text><text x="530" y="504" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">follow up - governance</text><text x="830" y="504" font-family="Arial,sans-serif" font-size="12" fill="#08766c" font-weight="800">PASSED</text><text x="1080" y="504" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">accepted</text><text x="60" y="524" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">The approved pilot baseline remains 30 October at this cutoff</text><rect x="38" y="549" width="1360" height="52" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="549" width="8" height="52" rx="4" fill="#667085"/><text x="60" y="570" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">RR-05 - Immediate operational coverage</text><text x="530" y="570" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">mandatory - operations</text><text x="830" y="570" font-family="Arial,sans-serif" font-size="12" fill="#667085" font-weight="800">UNKNOWN</text><text x="1080" y="570" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">pending</text><text x="60" y="590" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Current roster, access and escalation evidence are absent from this review packet</text><rect x="38" y="615" width="1360" height="52" rx="10" fill="#fff" stroke="#ccd6e5"/><rect x="38" y="615" width="8" height="52" rx="4" fill="#667085"/><text x="60" y="636" font-family="Arial,sans-serif" font-size="13" fill="#0c234b" font-weight="800">RR-06 - Recovery limits and monitoring trigg</text><text x="530" y="636" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">mandatory - operations</text><text x="830" y="636" font-family="Arial,sans-serif" font-size="12" fill="#667085" font-weight="800">UNKNOWN</text><text x="1080" y="636" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="700">pending</text><text x="60" y="656" font-family="Arial,sans-serif" font-size="10" fill="#536581" font-weight="400">Actual release-plan limits, monitoring signals and thresholds are not supplied</text><text x="38" y="744" font-family="Arial,sans-serif" font-size="12" fill="#b42318" font-weight="800">Blocking conditions: RR-01, RR-02, RR-05, RR-06</text><text x="38" y="768" font-family="Arial,sans-serif" font-size="11" fill="#536581" font-weight="400">Recommendation is computed from applicable gate evidence; it is not the formal release decision.</text><text x="38" y="790" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="400">This workspace recommends hold; it does not create Mina&#x27;s formal hold decision, Lena&#x27;s security acceptance or Theo&#x27;s later service acceptance.</text></svg>