<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Northstar - cutover readiness</title><desc id="desc">Independent release gate evidence as of 2026-11-25. The recommendation is separate from actual go authority.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><rect width="12" height="100%" fill="#173b2d"/><text x="38" y="42" font-family="Arial,sans-serif" font-size="12" fill="#d80b61" font-weight="800">CUTOVER CONTROL</text><text x="38" y="96" font-family="Arial,sans-serif" font-size="40" fill="#0c234b" font-weight="800">A failed restore controls the decision</text><text x="38" y="130" font-family="Arial,sans-serif" font-size="15" fill="#536581" font-weight="400">The approved phased plan stays visible without being mistaken for current recovery evidence.</text><rect x="38" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="53" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">RECOMMENDATION</text><text x="53" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">HOLD</text><rect x="308" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="323" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">BLOCKING GATES</text><text x="323" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">3</text><rect x="578" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="593" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">SATISFIED</text><text x="593" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0c234b" font-weight="800">1</text><rect x="848" y="160" width="252" height="86" rx="14" fill="#fff" stroke="#ccd6e5"/><text x="863" y="184" font-family="Arial,sans-serif" font-size="10" fill="#667085" font-weight="800">