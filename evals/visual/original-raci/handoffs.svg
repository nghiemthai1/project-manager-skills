<text x="26" y="572" font-size="12" fill="#26354a" font-weight="400">? means unresolved; no explicit no-assignment cells were supplied. No R is assigned to H-9.</text>
<text x="26" y="591" font-size="12" fill="#26354a" font-weight="400">Role-to-person mappings, confirmation dates, resolution authority and due dates were not supplied.</text>
