name: Build Codex release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_codex.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-manager-skills-codex
          path: dist/codex/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project-manager-skills-codex
          path: dist/codex
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/codex/*.zip --verify-tag --title "$RELEASE_TAG" --notes "Codex package: extract into a project root to add .agents/skills and AGENTS.md. Merge existing project instructions before replacing AGENTS.md."
